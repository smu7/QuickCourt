async function pBook({ el, params, query }) {
  const v = await api('/venues/' + params.id);
  if (v.status !== 'Approved') throw new Error('This venue is not accepting bookings right now.');
  const step = (v.slot_minutes || 60) / 60;
  const when = store.get('qc_when', 'sessionStorage') || {}; // date/time picked in the home search card
  let wantTime = when.time;
  const st = { sport: v.sports.includes(query.sport) ? query.sport : v.sports[0], date: when.date >= today() ? when.date : today(), duration: Math.max(step, 1), time: null, court: null, slots: [] };
  el.innerHTML = `<div class="page-head"><div><h1>Court booking</h1><p class="row muted"><strong style="color:var(--text)">${esc(v.name)}</strong> ${ICON.pin}${esc(v.area)}, ${esc(v.city)} ${rating(v.rating, v.reviewCount)}</p></div></div>
    <div class="book-grid">
      <form class="card" id="bf" novalidate>
        ${v.sports.length > 1 ? field('sport', 'Sport', `<select id="sport">${options(v.sports, st.sport)}</select>`) : ''}
        ${field('date', 'Date', `<input id="date" type="date" min="${today()}" max="${addDays(60)}" value="${st.date}" required>`, 'The selected date must be today or later.')}
        <div class="field"><span class="label">Start time</span><div id="slots"></div><small class="hint">Unavailable time slots are disabled.</small></div>
        <div class="field"><span class="label" id="durLbl">Duration</span><div class="stepper" role="group" aria-labelledby="durLbl">
          <button type="button" id="durMinus" aria-label="Decrease duration">−</button><strong id="dur" aria-live="polite"></strong><button type="button" id="durPlus" aria-label="Increase duration">+</button></div></div>
        ${field('court', 'Court', '<select id="court" disabled></select>')}
      </form>
      <aside class="card summary" aria-live="polite"><h2>Booking summary</h2><div id="sum"></div></aside>
    </div>`;

  const drawSummary = () => {
    const c = st.slots.find(s => s.time === st.time)?.courts.find(c => c.id === st.court);
    const total = c ? c.price_per_hour * st.duration : 0;
    $('#sum').innerHTML = `<dl class="kv"><dt>Sport</dt><dd>${esc(st.sport)}</dd><dt>Date</dt><dd>${fmtDate(st.date)}</dd>
      <dt>Time</dt><dd>${st.time ? timeRange(st.time, st.duration) : '—'}</dd><dt>Duration</dt><dd>${hrs(st.duration)}</dd>
      <dt>Court</dt><dd>${c ? esc(c.name) : '—'}</dd><dt>Price / hour</dt><dd>${c ? money(c.price_per_hour) : '—'}</dd></dl>
      <div class="total"><span>Total</span><span>${money(total)}</span></div>
      <p class="small muted">Price is calculated from the court's hourly rate and confirmed by the server.</p>
      <button class="btn btn-primary btn-block" id="toPay" ${c ? '' : 'disabled'}>Continue to Payment${c ? ' – ' + money(total) : ''}</button>`;
    $('#toPay').onclick = async (e) => {
      try {
        const r = await busy(e.target, () => api('/bookings', { method: 'POST', body: { venue_id: v.id, court_id: st.court, date: st.date, start_time: st.time, duration: st.duration } }));
        go('/payment/' + r.id);
      } catch (err) { toast(err.message, 'error'); loadSlots(); }
    };
  };
  const drawCourts = () => {
    const free = st.slots.find(s => s.time === st.time)?.courts || [];
    if (!free.some(c => c.id === st.court)) st.court = free.length === 1 ? free[0].id : null;
    $('#court').innerHTML = st.time ? options(free.map(c => [c.id, `${c.name} · ${money(c.price_per_hour)}/hr`]), st.court, '-- Select court --') : '<option>Pick a start time first</option>';
    $('#court').disabled = !st.time;
    drawSummary();
  };
  const drawSlots = (closed) => {
    $('#dur').textContent = hrs(st.duration);
    $('#durMinus').disabled = st.duration <= step;
    $('#durPlus').disabled = st.duration >= 6;
    $('#slots').innerHTML = closed ? '<p class="muted small">The facility is closed on this day. Pick another date.</p>'
      : !st.slots.some(s => s.available) ? '<p class="muted small">No free slots for this date and duration. Try another date or a shorter duration.</p>'
      : `<div class="slots">${st.slots.map(s => `<button type="button" class="slot" data-t="${s.time}" aria-pressed="${s.time === st.time}" ${s.available ? '' : 'disabled title="Unavailable"'}>${fmtTime(s.time)}</button>`).join('')}</div>`;
    drawCourts();
  };
  async function loadSlots() {
    $('#slots').innerHTML = loadingState('Checking availability…');
    try {
      const r = await api(`/venues/${v.id}/availability?` + qs({ date: st.date, sport: st.sport, duration: st.duration }));
      st.slots = r.slots;
      if (wantTime) { if (r.slots.some(s => s.time === wantTime && s.available)) st.time = wantTime; wantTime = null; }
      if (st.time && !r.slots.some(s => s.time === st.time && s.available)) { if (st.time) toast('That start time is no longer free for this duration.', 'error'); st.time = null; }
      drawSlots(r.closedDay);
    } catch (err) { $('#slots').innerHTML = errorState(err.message); }
  }
  $('#slots').onclick = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; st.time = b.dataset.t; $$('.slot').forEach(x => x.setAttribute('aria-pressed', x === b)); drawCourts(); };
  $('#court').onchange = (e) => { st.court = e.target.value || null; drawSummary(); };
  $('#date').onchange = (e) => { if (e.target.value < today()) e.target.value = today(); st.date = e.target.value; st.time = null; loadSlots(); };
  $('#sport') && ($('#sport').onchange = (e) => { st.sport = e.target.value; st.time = null; loadSlots(); });
  $('#durMinus').onclick = () => { st.duration = Math.max(step, st.duration - step); loadSlots(); };
  $('#durPlus').onclick = () => { st.duration = Math.min(6, st.duration + step); loadSlots(); };
  await loadSlots();
}

async function pPayment({ el, params }) {
  const b = await api('/bookings/' + params.id);
  if (b.status === 'Confirmed' || b.status === 'Completed') return go('/confirmation/' + b.id);
  if (b.status !== 'Reserved') { el.innerHTML = emptyState(`This booking is ${b.status.toLowerCase()}`, 'Please pick your slot again.', `<a class="btn btn-primary" href="#/book/${esc(b.venue_id)}">Book again</a>`); return; }
  const expires = new Date(b.created_at).getTime() + 10 * 60000;
  el.innerHTML = pageHead('Payment', 'Review your booking and complete the payment.') + `
    <div class="book-grid">
      <section class="card stack"><h2>Booking summary</h2>${bookingSummary(b)}
        <p class="callout">Slot held for you — <strong id="cd"></strong> left to pay.</p></section>
      <aside class="card summary"><form id="pf"><fieldset><legend>Payment method</legend>
          <label class="check" style="margin-bottom:8px"><input type="radio" name="method" value="UPI" checked> UPI</label>
          <label class="check"><input type="radio" name="method" value="Card"> Debit / Credit card</label></fieldset>
        <p class="demo-note">Simulated payment — no money is charged.</p>
        <div class="total"><span>Total</span><span>${money(b.total_price)}</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:12px">Pay ${money(b.total_price)}</button>
        <button type="button" class="btn btn-block" id="cancelRes" style="margin-top:8px">Cancel reservation</button></form></aside>
    </div>`;
  const tick = setInterval(() => {
    const cd = $('#cd'); if (!cd) return clearInterval(tick);
    const left = Math.max(0, expires - Date.now());
    cd.textContent = `${Math.floor(left / 60000)}:${pad(Math.floor(left / 1000) % 60)}`;
    if (!left) { clearInterval(tick); cd.textContent = '0:00 (expired)'; }
  }, 1000);
  $('#pf').onsubmit = async (e) => {
    e.preventDefault();
    try { await busy(e.submitter, () => api(`/bookings/${b.id}/pay`, { method: 'POST' })); go('/confirmation/' + b.id); }
    catch (err) { toast(err.message, 'error'); if (err.status === 409) go('/book/' + b.venue_id); }
  };
  $('#cancelRes').onclick = async (e) => {
    try { await busy(e.target, () => api(`/bookings/${b.id}/cancel`, { method: 'PUT' })); toast('Reservation released.'); go('/venue/' + b.venue_id); }
    catch (err) { toast(err.message, 'error'); }
  };
}

async function pMyBookings({ el, query }) {
  const list = await api('/my/bookings');
  const groups = {
    upcoming: list.filter(b => b.status === 'Confirmed').reverse(),
    completed: list.filter(b => b.status === 'Completed'),
    cancelled: list.filter(b => b.status === 'Cancelled'),
  };
  const tab = groups[query.tab] ? query.tab : 'upcoming';
  const empty = { upcoming: ['No upcoming bookings', 'Find a venue and book your next game.', '<a class="btn btn-primary" href="#/venues">Explore venues</a>'], completed: ['No completed bookings yet', 'Games you have played will appear here.'], cancelled: ['No cancelled bookings', ''] }[tab];
  el.innerHTML = pageHead('My Bookings', '', '<a class="btn btn-primary" href="#/venues">Book a court</a>')
    + tabs([['upcoming', 'Upcoming', groups.upcoming.length], ['completed', 'Completed', groups.completed.length], ['cancelled', 'Cancelled', groups.cancelled.length]], tab, k => '/bookings?tab=' + k)
    + (groups[tab].length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${groups[tab].map(bookingCard).join('')}</div>` : emptyState(...empty));
  const find = (id) => list.find(b => b.id === id);
  el.onclick = async (e) => {
    const t = e.target.closest('[data-view],[data-cancel],[data-review]');

    if (t.dataset.view) { const b = find(t.dataset.view); modal('Booking details', `${bookingSummary(b)}<p class="small muted" style="margin-top:10px">Status: ${badge(b.status)} · Payment: ${esc(b.payment_status || '—')}<br>Booking ID: ${esc(b.id)}</p>`); }
    if (t.dataset.review) reviewModal(find(t.dataset.review));
    if (t.dataset.cancel) {
      const b = find(t.dataset.cancel);
      if (!await confirmDialog('Cancel booking?', `${b.venue_name}, ${fmtDate(b.date)} at ${fmtTime(b.start_time)}. The slot will be released and the payment marked as refunded.`, 'Cancel booking', true)) return;
      try { await api(`/bookings/${b.id}/cancel`, { method: 'PUT' }); toast('Booking cancelled.'); render(); } catch (err) { toast(err.message, 'error'); }
    }
  };
}

      <fieldset><legend>Skill level</legend><div class="check-grid">${cat.skillLevels.map(s => `<label class="check"><input type="radio" name="skill_level" value="${s}" ${me.skill_level === s ? 'checked' : ''}> ${s}</label>`).join('')}</div></fieldset>
      <p class="form-error" role="alert"></p><div class="form-actions"><button class="btn btn-primary">Save</button></div></form>`,
    security: `<form id="cf" novalidate><h2>Change password</h2>
      ${field('currentPassword', 'Current Password', pwInput('currentPassword', 'current-password'))}
      ${field('newPassword', 'New Password', pwInput('newPassword'), PW_MSG)}
      ${field('confirmPassword', 'Confirm New Password', '<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>')}
      <p class="form-error" role="alert"></p><div class="form-actions"><button type="reset" class="btn">Reset</button><button class="btn btn-primary">Update password</button></div></form>`,
  }[tab];
  el.innerHTML = pageHead('Profile') + `<div class="venue-layout" style="grid-template-columns:280px 1fr">
    <aside class="card center stack"><div class="row" style="justify-content:center">${avatar(me, 84)}</div>
      <div><strong>${esc(me.name)}</strong><p class="small muted" style="margin:0">${esc(me.phone || 'No phone added')}<br>${esc(me.email)}</p>${badge(me.role === 'owner' ? 'Facility Owner' : me.role[0].toUpperCase() + me.role.slice(1))}</div>
      <nav class="menu" style="position:static;box-shadow:none;text-align:left" aria-label="Profile sections">
        ${items.map(([k, l]) => `<a href="#${path}?tab=${k}" ${k === tab ? 'aria-current="page" style="background:var(--surface-2)"' : ''}>${l}</a>`).join('')}
        ${isPlayer ? '<a href="#/bookings">All Bookings</a>' : ''}</nav></aside>
    <section class="card form-card">${body}</section></div>`;

  const saved = (u) => { setSession({ token: S.token, user: u }); toast('Profile saved.'); render(); };
  if (tab === 'personal') {
    $('#avatarFile').onchange = async (e) => {
      $('#err-avatar').textContent = '';
      try { avatarData = await readImage(e.target.files[0]); $('#avatarPick').innerHTML = `<img src="${avatarData}" alt="New profile picture">`; }
      catch (err) { $('#err-avatar').textContent = err.message; }
    };
    $('#rmAvatar') && ($('#rmAvatar').onclick = () => { avatarData = ''; $('#avatarPick').textContent = 'Add photo'; });
    $('#pf').onreset = () => { avatarData = me.avatar || ''; setTimeout(() => { $('#avatarPick').innerHTML = me.avatar ? `<img src="${esc(me.avatar)}" alt="">` : 'Add photo'; setErrors($('#pf'), {}); }); };

  if (tab === 'security') $('#cf').onsubmit = async (e) => {
    e.preventDefault();
    const d = formData(e.target), errs = {};
    if (!d.currentPassword) errs.currentPassword = 'Enter your current password.';
    if (!PW_RULE.test(d.newPassword)) errs.newPassword = PW_MSG;
    if (d.newPassword !== d.confirmPassword) errs.confirmPassword = 'Passwords do not match.';
    if (!setErrors(e.target, errs)) return;
    try { await busy(e.submitter, () => api('/me/password', { method: 'PUT', body: d })); e.target.reset(); toast('Password updated.'); } catch (err) { formError(e.target, err.message); }
  };
}

async function pOwnerDash({ el, query }) {
  const venues = await api('/owner/venues');

  const period = ['daily', 'weekly', 'monthly'].includes(query.period) ? query.period : 'daily';
  const s = await api('/owner/stats?' + qs({ period, venueId: query.venue }));
  const trend = period === 'daily' ? fillDays(s.trend.map(r => ({ label: r.label, value: r.bookings })), 14) : s.trend.map(r => ({ label: r.label, value: r.bookings }));
  const revenue = period === 'daily' ? fillDays(s.trend.map(r => ({ label: r.label, value: r.revenue })), 14) : s.trend.map(r => ({ label: r.label, value: r.revenue }));
  const peak = Array.from({ length: 18 }, (_, i) => { const h = pad(i + 6); return { label: fmtTime(h + ':00'), short: String((i + 6) % 12 || 12), value: s.peakHours.find(p => p.hour === h)?.bookings || 0 }; });
  const days = Array.from({ length: 7 }, (_, i) => addDays(i));
  const pending = venues.filter(v => v.status !== 'Approved');
  const live = venues.filter(v => v.status === 'Approved').length;
  el.innerHTML = HEAD_ART + pageHead(`Welcome back, ${S.user.name.split(' ')[0]}`, 'Here is how your facilities are doing.', venuePicker(venues, query.venue || '', 'All facilities'), `<span class="status-pill">${live} live facilit${live === 1 ? 'y' : 'ies'}</span>`)

    <div class="kpis">${statCard("Today's bookings", s.todayBookings, fmtDate(today()), 'blue', 'clock')}${statCard('Total bookings', s.totalBookings, 'confirmed + completed', 'red', 'cal')}${statCard('Active courts', s.activeCourts, `across ${live} live facilities`, 'green', 'court')}${statCard('Revenue', money(s.revenue), 'simulated payments', 'green', 'coins')}${statCard('Occupancy', s.occupancy + '%', 'booked vs open hours, last 7 days', 'orange', 'gauge')}</div>
    <section class="card" style="margin-bottom:16px"><div class="section-head"><h2>Booking calendar — next 7 days</h2><a href="#/owner/bookings">All bookings ›</a></div>
      <div class="calendar">${days.map(d => { const list = s.upcoming.filter(b => b.date === d); return `<div class="cal-day"><h3>${d === today() ? 'Today' : new Date(d + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' })}</h3>
        ${list.slice(0, 4).map(b => `<div class="cal-item">${fmtTime(b.start_time)} · ${esc(b.court_name)}<br><span class="muted">${esc(b.venue_name)}</span></div>`).join('') || '<span class="muted">No bookings</span>'}${list.length > 4 ? `<span class="muted">+${list.length - 4} more</span>` : ''}</div>`; }).join('')}</div></section>
    <div class="charts">
      <section class="card chart-card reveal t-red"><div class="section-head"><h2>Booking trends</h2></div>
        ${tabs([['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']], period, k => '/owner?' + qs({ venue: query.venue, period: k }))}
        ${barChart(trend, { title: `Bookings (${period})`, fmt: v => `${v} bookings` })}</section>
      <section class="card chart-card reveal t-green"><h2>Revenue summary</h2><p class="muted small">${period[0].toUpperCase() + period.slice(1)} earnings</p>
        ${barChart(revenue, { title: `Revenue (${period})`, fmt: money })}
        <h3 style="margin-top:14px">By sport (all time)</h3>${hbarChart(s.bySport.map(r => ({ label: r.label, value: r.revenue })), { fmt: money })}</section>
      <section class="card chart-card reveal t-orange"><h2>Peak booking hours</h2><p class="muted small">Bookings by start hour, all time</p>${barChart(peak, { title: 'Bookings by hour', fmt: v => `${v} bookings` })}</section>
      <section class="card chart-card reveal t-blue"><div class="section-head"><h2>Recent customers</h2><a class="small" href="#/owner/bookings">All bookings ›</a></div>
        ${miniList(s.recentCustomers.map(c => miniRow(avatar(c, 34), esc(c.name), esc(c.email), `<strong>${c.bookings}</strong> booking${c.bookings === 1 ? '' : 's'} · ${money(c.spent)}<br><span class="muted">last ${fmtShort(c.last_date)}</span>`)), 'No customers yet.')}</section>

    return `<div class="field"><label for="photos">Upload photos</label><input id="photos" type="file" accept="image/*" multiple>
        <small class="hint">Up to 8 photos, each under 1 MB. Choose one as the cover photo shown on venue cards.</small><small class="err" id="err-images"></small></div>
      <div class="photo-grid" id="photoGrid">${d.images.map((src, i) => `<div class="photo"><img src="${esc(src)}" alt="Photo ${i + 1}">
        <div class="row"><label class="row"><input type="radio" name="cover" value="${i}" ${src === d.cover_image || (!d.images.includes(d.cover_image) && i === 0) ? 'checked' : ''}> Cover</label><button type="button" class="link" data-rm="${i}" aria-label="Remove photo ${i + 1}">Remove</button></div></div>`).join('')}</div>
      ${d.images.length ? '' : '<p class="muted small">No photos yet.</p>'}`;
  }

  function collect(form) {
    const fd = new FormData(form);
    if (step === 1) Object.assign(d, formData(form));
    if (step === 2) Object.assign(d, { sports: fd.getAll('sports'), amenities: fd.getAll('amenities'), venue_type: fd.get('venue_type') || '' });
    if (step === 3 && d.images.length) d.cover_image = d.images[+(fd.get('cover') ?? 0)] || d.images[0];
  }
  function validate(form) {
    const e = {};
    if (step === 1) {
      for (const [k, l] of [['name', 'Facility name'], ['description', 'Description'], ['address', 'Address line'], ['area', 'Area / locality'], ['city', 'City'], ['state', 'State']]) if (!d[k]) e[k] = `${l} is required.`;
      if (!/^\d{6}$/.test(d.pincode)) e.pincode = 'Pincode must be 6 digits.';
      if (!/^\d{10}$/.test(d.contact_phone)) e.contact_phone = 'Contact phone must be 10 digits.';
      if (d.latitude === '' || Math.abs(d.latitude) > 90) e.latitude = 'Enter a valid latitude.';
      if (d.longitude === '' || Math.abs(d.longitude) > 180) e.longitude = 'Enter a valid longitude.';
    }
    if (step === 2) { if (!d.sports.length) e.sports = 'Select at least one sport.'; if (!d.venue_type) e.venue_type = 'Choose a venue type.'; }
    if (step === 3 && !d.images.length) e.images = 'Upload at least one photo.';
    return setErrors(form, e);
  }

  function draw() {
    el.innerHTML = pageHead(editing ? `Edit ${d.name}` : 'Add facility', editing ? 'Saving sends the facility back to admin for approval.' : 'Three quick steps, then an admin reviews your facility.')
      + `<ol class="steps">${STEPS.map((s, i) => `<li class="${i + 1 === step ? 'current' : i + 1 < step ? 'done' : ''}" ${i + 1 === step ? 'aria-current="step"' : ''}>${i + 1}. ${s}</li>`).join('')}</ol>
      <form id="wf" class="card form-card" novalidate><h2>${STEPS[step - 1]}</h2>${stepHtml()}<p class="form-error" role="alert"></p>
        <div class="form-actions">${step > 1 ? '<button type="button" class="btn" id="back">Back</button>' : '<a class="btn" href="#/owner/facilities">Cancel</a>'}
          <button class="btn btn-primary">${step < 3 ? 'Next' : editing ? 'Save & resubmit' : 'Submit for approval'}</button></div></form>`;
    const form = $('#wf');
    $('#back') && ($('#back').onclick = () => { collect(form); step--; draw(); });
    if (step === 1) {
      const syncMap = () => { $('#mapLink').href = `https://www.google.com/maps?q=${form.latitude.value},${form.longitude.value}`; };
      syncMap(); form.latitude.oninput = form.longitude.oninput = syncMap;
      bindLocFields(form, cat.locations, false, ([lat, lng, pin]) => { form.pincode.value = pin; form.latitude.value = lat; form.longitude.value = lng; syncMap(); });
      $('#geo').onclick = () => navigator.geolocation?.getCurrentPosition(
        (p) => { form.latitude.value = p.coords.latitude.toFixed(6); form.longitude.value = p.coords.longitude.toFixed(6); syncMap(); },
        () => toast('Could not get your location. Enter it manually.', 'error'));
    }
    if (step === 3) {
      $('#photos').onchange = async (e) => {
        collect(form);
        const errs = [];
        for (const f of e.target.files) {
          if (d.images.length >= 8) { errs.push('Maximum 8 photos.'); break; }
          try { d.images.push(await readImage(f)); } catch (err) { errs.push(`${f.name}: ${err.message}`); }
        }
        draw();
        if (errs.length) $('#err-images').textContent = errs.join(' ');
      };
      $('#photoGrid').onclick = (e) => { const b = e.target.closest('[data-rm]'); if (!b) return; collect(form); const [gone] = d.images.splice(+b.dataset.rm, 1); if (gone === d.cover_image) d.cover_image = d.images[0] || ''; draw(); };
    }
    form.onsubmit = async (e) => {
      e.preventDefault();
      collect(form);
      if (!validate(form)) return;
      if (step < 3) { step++; draw(); return; }
      try {
        await busy(e.submitter, () => api(editing ? '/owner/venues/' + params.id : '/owner/venues', { method: editing ? 'PUT' : 'POST', body: d }));
        toast(editing ? 'Changes saved and sent for approval.' : 'Facility submitted! An admin will review it shortly.');
        go(editing ? '/owner/facilities' : '/owner/facilities');
      } catch (err) { formError(form, err.message); }
    };
  }
  draw();
}

function courtModal(v, court) {
  const c = court || { name: '', sport: v.sports[0], price_per_hour: '', status: 'Active' };
  const ov = !!c.opening_time;
  const d = modal(court ? 'Edit court' : 'Add court', `<form id="cf" novalidate>
    ${field('name', 'Court Name', `<input id="name" name="name" value="${esc(c.name)}" placeholder="e.g. Court 3" required>`)}
    <div class="grid-2">${field('sport', 'Sport', `<select id="sport" name="sport">${options(v.sports, c.sport)}</select>`)}
      ${field('price_per_hour', 'Base Price / Hour (₹)', `<input id="price_per_hour" name="price_per_hour" type="number" min="1" value="${esc(c.price_per_hour)}" required>`)}</div>
    ${field('status', 'Status', `<select id="status" name="status">${options(['Active', 'Maintenance'], c.status)}</select>`, 'Maintenance hides the court from booking.')}
    <label class="row small" style="margin-bottom:10px"><input type="checkbox" id="ov" ${ov ? 'checked' : ''}> Override facility hours (${fmtTime(v.opening_time)} – ${fmtTime(v.closing_time)}) for this court</label>
    <div class="grid-2" id="ovBox" ${ov ? '' : 'hidden'}>${field('opening_time', 'Opens', `<input id="opening_time" name="opening_time" type="time" value="${esc(c.opening_time || v.opening_time)}">`)}
      ${field('closing_time', 'Closes', `<input id="closing_time" name="closing_time" type="time" value="${esc(c.closing_time || v.closing_time)}">`)}</div>
    <p class="form-error" role="alert"></p><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">${court ? 'Save court' : 'Add court'}</button></div></form>`);
  $('#ov', d).onchange = (e) => { $('#ovBox', d).hidden = !e.target.checked; };
  $('#cf', d).onsubmit = async (e) => {
    e.preventDefault();
    const f = formData(e.target), errs = {};
    if (!f.name) errs.name = 'Court name is required.';
    if (!(+f.price_per_hour > 0)) errs.price_per_hour = 'Enter a price above 0.';
    if (!$('#ov', d).checked) { f.opening_time = ''; f.closing_time = ''; }

    catch (err) { formError(e.target, err.message); }
  };
}

function blockModal(courtName, courtId, date, start, end) {
  const d = modal('Block time', `<form id="bk" novalidate><p class="muted small">${esc(courtName)} · ${fmtDate(date)}</p>

    <div class="charts">

          <input type="date" id="dpick" aria-label="Date" min="${today()}" value="${date}"></div>
          <div class="legend" style="margin-bottom:10px"><span><i style="border-color:#14532d"></i>Available — click to block</span><span><i style="border-color:#1e3a5f"></i>Booked</span><span><i style="border-color:#5b4712"></i>Blocked — click to unblock</span></div>
          ${court.status !== 'Active' ? '<p class="callout small">This court is in Maintenance — change its status on the Courts page to reopen it.</p>' : ''}
          ${grid.closedDay ? '<p class="muted">Facility is closed on this day (not an active day).</p>' : `<div class="slots" id="sg">${grid.slots.map(s => `<button type="button" class="slot s-${s.status}" data-s="${s.time}" data-e="${s.end}" data-st="${s.status}" ${s.blockId ? `data-b="${esc(s.blockId)}"` : ''} ${s.status === 'booked' || s.status === 'maintenance' ? 'disabled' : ''} title="${s.reason ? esc(s.reason) : s.status}">${fmtTime(s.time)}</button>`).join('')}</div>`}
          <div class="form-actions"><button class="btn btn-sm" id="range">Block a time range</button></div>`
        : emptyState('No courts yet', 'Add a court before managing slots.', `<a class="btn btn-primary" href="#/owner/courts?venue=${esc(v.id)}">Add court</a>`)}
      </section></div>`;

  const nav = (o) => go('/owner/availability?' + qs({ venue: v.id, court: court?.id, date, ...o }));
  $('#cpick') && ($('#cpick').onchange = (e) => nav({ court: e.target.value }));
  $('#dpick') && ($('#dpick').onchange = (e) => nav({ date: e.target.value }));
  $('#range') && ($('#range').onclick = () => blockModal(court.name, court.id, date, v.opening_time, v.closing_time));
  $('#sg') && ($('#sg').onclick = async (e) => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.st === 'available') return blockModal(court.name, court.id, date, b.dataset.s, b.dataset.e);
    if (b.dataset.b && await confirmDialog('Unblock this time?', 'Players will be able to book it again.', 'Unblock')) {
      try { await api('/owner/blocks/' + b.dataset.b, { method: 'DELETE' }); toast('Slot reopened.'); render(); } catch (err) { toast(err.message, 'error'); }
    }
  });
  $('#av').onsubmit = async (e) => {
    e.preventDefault();
    const f = formData(e.target), days = new FormData(e.target).getAll('days').map(Number), errs = {};

      render();
    } catch (err) { formError(e.target, err.message); }
  };
}

      <dt>Submitted</dt><dd>${fmtStamp(v.created_at)}</dd><dt>Status</dt><dd>${badge(v.status)}${v.reject_reason ? ` <span class="small muted">${esc(v.reject_reason)}</span>` : ''}</dd></dl>
    ${v.status === 'Pending' ? `<form id="rj" novalidate style="margin-top:16px">${field('reason', 'Rejection reason / comment (sent to the owner if rejected)', '<textarea id="reason" name="reason" maxlength="300" placeholder="e.g. Photos are blurry, please re-upload."></textarea>')}
      <p class="form-error" role="alert"></p><div class="form-actions"><button type="button" class="btn btn-danger" id="reject">Reject</button><button type="button" class="btn btn-primary" id="approve">Approve</button></div></form>` : ''}`, { wide: true });
  const act = async (btn, path, body, msg) => {
    try { await busy(btn, () => api(`/admin/venues/${v.id}/${path}`, { method: 'PUT', body })); d.close(); toast(msg); render(); }
    catch (err) { formError($('#rj', d), err.message); }
  };
  $('#approve', d) && ($('#approve', d).onclick = (e) => act(e.target, 'approve', null, `${v.name} approved.`));
  $('#reject', d) && ($('#reject', d).onclick = (e) => act(e.target, 'reject', { reason: $('#reason', d).value.trim() }, `${v.name} rejected.`));
}

async function pAdminFacilities({ el, query }) {
  const status = ['Pending', 'Approved', 'Rejected'].includes(query.status) ? query.status : 'Pending';
  const list = await api('/admin/venues?status=' + status);
  el.innerHTML = pageHead('Facility approval', 'Review submitted details and photos. Admins approve or reject — they never edit owner data.')
    + tabs([['Pending', 'Pending'], ['Approved', 'Approved'], ['Rejected', 'Rejected']], status, k => '/admin/facilities?status=' + k)
    + (list.length ? `<div class="stack">${list.map(v => `<article class="card list-row"><img src="${esc(v.cover_image)}" alt="">
        <div><div class="row"><h3 style="margin:0">${esc(v.name)}</h3>${badge(v.status)}</div>
          <p class="small muted" style="margin:2px 0">Owner: ${esc(v.owner_name)} · ${esc(v.area)}, ${esc(v.city)} · ${esc(v.sports.join(', '))}</p>
          <p class="small muted" style="margin:0">Submitted ${fmtStamp(v.created_at)}</p></div>
        <div><button class="btn btn-sm ${status === 'Pending' ? 'btn-primary' : ''}" data-review="${esc(v.id)}">${status === 'Pending' ? 'Review' : 'View'}</button></div></article>`).join('')}</div>`
      : emptyState(`No ${status.toLowerCase()} facilities`, status === 'Pending' ? 'All caught up — new submissions will appear here.' : ''));
  el.onclick = (e) => { const t = e.target.closest('[data-review]'); if (t) facilityReview(list.find(v => v.id === t.dataset.review)); };
}

async function pAdminUsers({ el, query }) {
  const list = await api('/admin/users?' + qs({ q: query.q, role: query.role, status: query.status }));
  el.innerHTML = pageHead('User management', 'All players and facility owners.') + `
    <form class="toolbar" id="uf" role="search"><input name="q" type="search" value="${esc(query.q || '')}" placeholder="Search name or email" aria-label="Search users">
      <select name="role" aria-label="Role">${options([['player', 'Player'], ['owner', 'Facility Owner']], query.role, 'All roles')}</select>
      <select name="status" aria-label="Status">${options(['Active', 'Banned'], query.status, 'All statuses')}</select></form>`
    + dataTable([
      ['Name', u => `<span class="row">${avatar(u, 28)}${esc(u.name)}</span>`], ['Email', u => esc(u.email)], ['Role', u => u.role === 'owner' ? 'Facility Owner' : 'Player'],
      ['Status', u => badge(u.status)], ['Joined', u => fmtStamp(u.created_at).split(',')[0]], ['Bookings', u => u.booking_count],
      ['Actions', u => `<div class="row"><button class="btn btn-sm" data-view="${esc(u.id)}">View</button><button class="btn btn-sm" data-hist="${esc(u.id)}">Booking history</button>
        ${u.status === 'Banned' ? `<button class="btn btn-sm" data-unban="${esc(u.id)}">Unban</button>` : `<button class="btn btn-sm btn-danger" data-ban="${esc(u.id)}">Ban</button>`}</div>`],
    ], list, 'No users match these filters.');
  const apply = () => go('/admin/users?' + qs(formData($('#uf'))));
  $('#uf').onchange = apply;
  $('#uf').onsubmit = (e) => { e.preventDefault(); apply(); };
  el.onclick = async (e) => {
    const t = e.target.closest('[data-view],[data-hist],[data-ban],[data-unban]'); if (!t) return;
    const u = list.find(x => x.id === Object.values(t.dataset)[0]);
    if (t.dataset.view) modal(u.name, `<div class="row" style="margin-bottom:12px">${avatar(u, 56)}<div><strong>${esc(u.name)}</strong><br><span class="muted small">${esc(u.email)}</span></div></div>
      <dl class="kv"><dt>Role</dt><dd>${u.role === 'owner' ? 'Facility Owner' : 'Player'}</dd><dt>Status</dt><dd>${badge(u.status)}</dd><dt>Phone</dt><dd>${esc(u.phone || '—')}</dd>
      <dt>Joined</dt><dd>${fmtStamp(u.created_at)}</dd><dt>Bookings</dt><dd>${u.booking_count}</dd></dl>`);
    if (t.dataset.hist) {
      const d = modal(`${u.name} — booking history`, loadingState(), { wide: true });
      try {
        const bs = await api(`/admin/users/${u.id}/bookings`);
        $('.modal-inner', d).lastElementChild.outerHTML = dataTable([['Venue', b => esc(b.venue_name)], ['Court', b => esc(b.court_name)], ['Date', b => fmtDate(b.date)], ['Time', b => timeRange(b.start_time, b.duration)], ['Amount', b => money(b.total_price)], ['Status', b => badge(b.status)]], bs, 'No bookings.');
      } catch (err) { toast(err.message, 'error'); }
    }
    if (t.dataset.ban || t.dataset.unban) {
      const ban = !!t.dataset.ban;
      if (!await confirmDialog(`${ban ? 'Ban' : 'Unban'} ${u.name}?`, ban ? 'They will be signed out and unable to log in.' : 'They will be able to log in again.', ban ? 'Ban user' : 'Unban', ban)) return;
      try { await api(`/admin/users/${u.id}/${ban ? 'ban' : 'unban'}`, { method: 'PUT' }); toast(`${u.name} ${ban ? 'banned' : 'unbanned'}.`); render(); } catch (err) { toast(err.message, 'error'); }
    }
  };
}

async function pAdminReports({ el }) {
  const list = await api('/admin/reports');
  el.innerHTML = pageHead('Reports & moderation', 'Reports submitted by users about facilities or other users.')
    + dataTable([
      ['Reported', r => `<span class="chip">${r.target_type === 'venue' ? 'Facility' : 'User'}</span> ${r.target_type === 'venue' ? `<a href="#/venue/${esc(r.target_id)}">${esc(r.target_name || r.target_id)}</a>` : esc(r.target_name || r.target_id)}`],
      ['Reason', r => esc(r.reason)], ['Reporter', r => esc(r.reporter_name)], ['Submitted', r => fmtStamp(r.created_at)], ['Status', r => badge(r.status)],
      ['Admin action', r => r.status === 'Open' ? `<button class="btn btn-sm btn-primary" data-act="${esc(r.id)}">Take action</button>` : `<span class="small">${esc(r.admin_action)}</span>`],
    ], list, 'No reports. Nice and quiet.');
  el.onclick = (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const r = list.find(x => x.id === t.dataset.act);
    const strong = r.target_type === 'user' ? ['ban_user', 'Ban this user'] : ['unlist_facility', 'Unlist this facility (sets it to Rejected)'];
    const d = modal('Take action', `<form id="ra" novalidate><p class="small muted">${esc(r.target_name)}: “${esc(r.reason)}”</p>
      <fieldset><legend>Action</legend>${[strong, ['resolve', 'Mark resolved (no further action)'], ['dismiss', 'Dismiss report']].map(([v, l], i) => `<label class="check" style="margin-bottom:6px"><input type="radio" name="action" value="${v}" ${i === 1 ? 'checked' : ''}> ${l}</label>`).join('')}</fieldset>
      ${field('note', 'Note (optional)', '<textarea id="note" name="note" maxlength="300"></textarea>')}
      <p class="form-error" role="alert"></p><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">Apply</button></div></form>`);
    $('#ra', d).onsubmit = async (ev) => {
      ev.preventDefault();
      try { await busy(ev.submitter, () => api('/admin/reports/' + r.id, { method: 'PUT', body: formData(ev.target) })); d.close(); toast('Report updated.'); render(); }
      catch (err) { formError(ev.target, err.message); }
    };
  };
}

/* =========================================================================
   ROUTER — [path, page, layout, allowed roles]
   ========================================================================= */
const ROUTES = [
  ['/oauth', pOAuth, 'auth', ['guest', 'player', 'owner', 'admin']],
  ['/login', pAuth, 'auth', ['guest']], ['/signup', pAuth, 'auth', ['guest']], ['/verify', pVerify, 'auth', ['guest']],
  ['/forgot', pForgot, 'auth', ['guest']], ['/reset', pReset, 'auth', ['guest']],
  ['/', pHome, 'site', ['guest', 'player']], ['/venues', pVenues, 'site', ['guest', 'player']],
  ['/venue/:id', pVenue, 'site', ['guest', 'player', 'owner', 'admin']],
  ['/book/:id', pBook, 'site', ['player']], ['/payment/:id', pPayment, 'site', ['player']], ['/confirmation/:id', pConfirmation, 'site', ['player']],
  ['/bookings', pMyBookings, 'site', ['player']],
  ['/matches', pMatches, 'site', ['guest', 'player']], ['/matches/new', pCreateMatch, 'site', ['player']], ['/match/:id', pMatch, 'site', ['guest', 'player']],
  ['/profile', pProfile, 'site', ['player']],
  ['/owner', pOwnerDash, 'owner', ['owner']], ['/owner/facilities', pFacilities, 'owner', ['owner']],
  ['/owner/facility/new', pFacilityWizard, 'owner', ['owner']], ['/owner/facility/:id/edit', pFacilityWizard, 'owner', ['owner']],
  ['/owner/courts', pCourts, 'owner', ['owner']], ['/owner/availability', pAvailability, 'owner', ['owner']],
  ['/owner/bookings', pOwnerBookings, 'owner', ['owner']], ['/owner/profile', pProfile, 'owner', ['owner']],
  ['/admin', pAdminDash, 'admin', ['admin']], ['/admin/facilities', pAdminFacilities, 'admin', ['admin']],
  ['/admin/users', pAdminUsers, 'admin', ['admin']], ['/admin/reports', pAdminReports, 'admin', ['admin']], ['/admin/profile', pProfile, 'admin', ['admin']],
];

function matchPath(pattern, path) {
  const a = pattern.split('/'), b = path.split('/');
  if (a.length !== b.length) return null;
  const params = {};
  for (let i = 0; i < a.length; i++) {
    if (a[i].startsWith(':')) params[a[i].slice(1)] = decodeURIComponent(b[i]);
    else if (a[i] !== b[i]) return null;
  }
  return params;
}

// Footer: columns are accordions on phones, plain lists on desktop. The court draws once, the first time the footer scrolls into view.
function initFooter() {
  if (matchMedia('(max-width: 720px)').matches) $$('.qf-col').forEach(d => d.open = false);
  const f = $('.qfoot.full');
  if (!f || matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return; // no JS class = finished court, content visible
  f.classList.add('pre');
  const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { f.classList.replace('pre', 'go'); io.disconnect(); } }, { threshold: .3 });
  io.observe(f);
}
const PATH = { prev: '', cur: '' };
async function render() {
  const raw = location.hash.slice(1) || '/';
  const [path, search = ''] = raw.split('?');
  const query = Object.fromEntries(new URLSearchParams(search));
  let route, params;
  for (const r of ROUTES) if ((params = matchPath(r[0], path))) { route = r; break; }
  const r = role();
  if (route && !route[3].includes(r)) return go(r === 'guest' ? '/login?next=' + enc(raw) : HOME[r]);
  $$('dialog[open]').forEach(d => d.close()); // a modal never outlives its page (e.g. browser Back)
  if (r === 'player' && !S.favs) S.favs = new Set((await api('/my/favorites').catch(() => [])).map(v => v.id)); // hearts need this before any card renders
  const layout = route ? route[2] : 'site';
  [PATH.prev, PATH.cur] = [PATH.cur, path];
  $('#app').innerHTML = layout === 'auth' ? authShell() : layout === 'site' ? siteShell(path) : dashShell(layout, path);
  document.title = 'QuickCourt';
  window.scrollTo(0, 0);
  initFooter();
  loadNotifDot();
  const el = $('#page');
  if (!route) { el.innerHTML = emptyState('Page not found', "The page you're looking for doesn't exist.", `<a class="btn btn-primary" href="#${HOME[r]}">Go home</a>`); return; }
  el.innerHTML = loadingState();
  try { await route[1]({ el, params, query, path }); }
  catch (e) { if (el.isConnected) el.innerHTML = errorState(e.message); }
}

// Global delegated handlers (logout, retry, password eye, mobile menu, dropdowns).
document.addEventListener('click', async (e) => {
  $$('details.dropdown[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
  const t = e.target.closest('[data-action],[data-pw],[data-jump],[data-fav]');
  if (!t) return;
  // In-page jump when the section is here (Home); elsewhere the link's #/?to=… route lands on Home and pHome scrolls.
  if (t.dataset.jump && document.getElementById(t.dataset.jump)) { e.preventDefault(); $('.nav')?.classList.remove('open'); jumpTo(t.dataset.jump, true); }
  if (t.dataset.pw) { const i = document.getElementById(t.dataset.pw), hidden = i.type !== 'password'; i.type = hidden ? 'password' : 'text'; t.setAttribute('aria-label', hidden ? 'Show password' : 'Hide password'); t.innerHTML = hidden ? ICON.eye : ICON.eyeOff; }
  if (t.dataset.action === 'retry') render();
  if (t.dataset.action === 'loc') openLocationPicker();
  if (t.dataset.action === 'loc-all') { setLoc({ ...LOC, area: '' }); relocate(); }
  if (t.dataset.fav) toggleFav(t);
  if (t.dataset.action === 'menu') $('.nav').classList.toggle('open');
  if (t.dataset.action === 'logout') { try { await api('/auth/logout', { method: 'POST' }); } catch {} setSession(null); toast('Logged out.'); go('/login'); }
});
// Broken remote photo → leave the neutral card background instead of a broken-image icon.
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.style.visibility = 'hidden'; }, true);
document.addEventListener('toggle',(e) => { if (e.target.id === 'bell' && e.target.open) openNotifs(); }, true);
window.addEventListener('hashchange', render);
render();
</script>
